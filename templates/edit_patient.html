```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Patient</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f1f5f9;
            font-family: Arial, sans-serif;
        }

        .edit-container {
            max-width: 750px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        }

        h2 {
            color: #173b65;
            text-align: center;
            margin-bottom: 25px;
        }
    </style>
</head>

<body>

<div class="container edit-container">

    <h2>Edit Patient Details</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="alert alert-{{ category }}">
                {{ message }}
            </div>
        {% endfor %}
    {% endwith %}

    <form method="POST">

        <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" name="full_name" class="form-control"
                   value="{{ patient.full_name }}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Date of Birth (DD/MM/YYYY)</label>
            <input type="text" name="date_of_birth" class="form-control"
                   value="{{ patient.date_of_birth.strftime('%d/%m/%Y') }}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Email Address</label>
            <input type="text" name="email" class="form-control"
                   value="{{ patient.email }}" required>
        </div>

        <h5 class="mt-4 mb-3">Blood Test Results</h5>

        <div class="mb-3">
            <label class="form-label">Glucose</label>
            <input type="number" step="any" min="0" name="glucose"
                   class="form-control" value="{{ patient.glucose }}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Haemoglobin</label>
            <input type="number" step="any" min="0" name="haemoglobin"
                   class="form-control" value="{{ patient.haemoglobin }}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Cholesterol</label>
            <input type="number" step="any" min="0" name="cholesterol"
                   class="form-control" value="{{ patient.cholesterol }}" required>
        </div>

        <div class="d-flex gap-2 mt-4">
            <button type="submit" class="btn btn-primary">
                Save Changes
            </button>

            <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">
                Cancel
            </a>
        </div>

    </form>

</div>

</body>
</html>
