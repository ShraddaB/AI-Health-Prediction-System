<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Patient | AI Health System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f1f5f9;
            font-family: Arial, sans-serif;
        }

        .form-container {
            max-width: 750px;
            margin: 40px auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        h2 {
            color: #173b65;
            font-weight: bold;
        }

        .btn-primary {
            background: #176b87;
            border: none;
        }

        .btn-primary:hover {
            background: #10536b;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="form-container">

        <h2 class="text-center mb-2">AI Health Prediction System</h2>

      <p class="text-center text-muted mb-4">
    Register Patient Health Information
</p>

{% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
        <div class="alert alert-{{ category }}">
            {{ message }}
        </div>
    {% endfor %}
{% endwith %}

        <form method="POST" action="/add-patient">

            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" name="full_name"
                       class="form-control"
                       placeholder="Enter full name" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Date of Birth</label>
                <input type="text" name="date_of_birth"
                       class="form-control"
                       placeholder="DD/MM/YYYY"
                       pattern="\d{2}/\d{2}/\d{4}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <input type="text" name="email"
                       class="form-control"
                       placeholder="example@gmail.com" required>
            </div>

            <hr>

            <h5 class="mb-3">Blood Test Results</h5>

            <div class="row">

                <div class="col-md-4 mb-3">
                    <label class="form-label">Glucose</label>
                    <input type="number" step="any" min="0"
                           name="glucose"
                           class="form-control" required>
                </div>

                <div class="col-md-4 mb-3">
                    <label class="form-label">Haemoglobin</label>
                    <input type="number" step="any" min="0"
                           name="haemoglobin"
                           class="form-control" required>
                </div>

                <div class="col-md-4 mb-3">
                    <label class="form-label">Cholesterol</label>
                    <input type="number" step="any" min="0"
                           name="cholesterol"
                           class="form-control" required>
                </div>

            </div>

            <button type="submit" class="btn btn-primary w-100 mt-3">
                Register Patient
            </button>

            <a href="/" class="btn btn-outline-secondary w-100 mt-2">
                Back to Dashboard
            </a>

        </form>

    </div>
</div>

</body>
</html>
